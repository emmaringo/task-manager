services:
  # Backend API
  - type: web
    name: task-manager-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
